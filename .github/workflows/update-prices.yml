name: Update price history

on:
  schedule:
    - cron: '0 22 * * *' # UTC 22:00 = Asia/Tokyo 07:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prices
        env:
          YAHOO_APP_ID: ${{ secrets.YAHOO_APP_ID }}
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/price-history.json data/display-data.json
          git diff --cached --quiet || git commit -m "chore: update price history"
          git push
