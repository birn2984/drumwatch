name: Update price history

on:
  schedule:
    - cron: '0 7 * * *'
      timezone: 'Asia/Tokyo'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prices:update
        env:
          YAHOO_APP_ID: ${{ secrets.YAHOO_APP_ID }}
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/price-history.json data/display-data.json
          if git diff --cached --quiet; then
            echo "Changed files: none; no commit required"
          else
            git diff --cached --name-only
            git commit -m "chore: update price history"
            git push origin HEAD:main
          fi
